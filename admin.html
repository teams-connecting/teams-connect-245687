  <script>
  $(document).ready(function(){
  $('#submit-btn').click(function(event){
  // 1. Grab text from a jQuery element
var name=$("#name").val();
var email=$("#email").val();
if (!name) {
   alert('Input names');
                return false;
            }
if (!email) {
   alert('Input email');
                return false;
            }
			

let encoded = window.btoa(email);
let encodeds = window.btoa(name);
var url = "https://teams-connect-9889700.pages.dev/?page=join&agent=U2FsdGVkX1%2FgY7MWhr7s22syQkkzZ9eOOk61?&e="+encoded+"&?n="+encodeds

$('#emailich').html(url);
$("#first").css("display", "block");
$("#emailich").css("display", "block");
  });

    $('#copyBtn').on('click', function() {
        // Use .text() to extract string content from the paragraph
        var textToCopy = $('#emailich').text();

        // Write the extracted text directly to the clipboard
        navigator.clipboard.writeText(textToCopy).then(function() {
            alert('Link is copied!');
        }).catch(function(err) {
            console.error('Error copying text: ', err);
        });
    });
	});
  </script>
